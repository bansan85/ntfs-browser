---
name: format
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Globally update npm
        run: npm install -g npm
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Install python modules dependencies
        run: uv sync --locked
      - name: no friend declaration
        shell: bash
        run: |
          uv run python ./.github/scripts/check-no-friend.py
      - name: strategy templates self-test
        shell: bash
        run: |
          uv run python ./.github/scripts/check-strategy-templates.py --self-test
      - name: no code in Strategy-only template headers
        shell: bash
        run: |
          uv run python ./.github/scripts/check-strategy-templates.py
      - name: formatter
        shell: bash
        run: |
          uv run bash ./.github/scripts/format.sh
      - name: Fix formatting
        shell: bash
        run: |
          git add .
          if [ -n "$(git diff-index --name-only HEAD --)" ]; \
          then \
            echo "Please, fix formatting with uploaded patch."
            git diff --cached; \
            exit 1; \
          fi
