---
name: Build
on: [push]
env:
  VERBOSE: 1
jobs:
  # Downloads the forensic image corpora once, into a cache every Windows test
  # leg restores. On Linux: ewfexport (libewf) converts the NPS E01 to raw.
  test-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        id: cache
        with:
          path: test-data
          key: test-data-${{ hashFiles('.github/scripts/fetch-test-data.py') }}
          enableCrossOsArchive: true
      - name: Download test data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -yq ewf-tools
          python3 .github/scripts/fetch-test-data.py download
  build:
    needs: test-data
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build_type: [Debug, Release]
        name: [windows]
        build_shared_libs: [ON, OFF]
        include:
          - name: windows
            os: windows-latest
            cxx_flags: /MP
          - name: windows
            build_shared_libs: ON
            preset: shared
          - name: windows
            build_shared_libs: OFF
            preset: static
          - name: windows-no-decompression
            os: windows-latest
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            preset: no-decompression
          - name: windows-no-efs-cryptopp
            os: windows-latest
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            preset: efs-bcrypt-only
          - name: windows-no-efs-bcrypt
            os: windows-latest
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            preset: efs-cryptopp-only
          - name: windows-no-efs
            os: windows-latest
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            preset: no-efs
          - name: windows-x86-debug
            os: windows-2025-vs2026
            cxx_flags: /MP
            build_type: Debug
            preset: vs2026-x86
          - name: linux-gcc
            cxx: g++
            os: ubuntu-latest
            build_type: Debug
            preset: efs-cryptopp-only
          - name: linux-clang
            cxx: clang++
            os: ubuntu-latest
            build_type: Debug
            preset: efs-cryptopp-only
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install g++ (Linux)
        if: matrix.name == 'linux-gcc'
        run: sudo apt-get update && sudo apt-get install -yq ninja-build g++
      - name: Install clang (Linux)
        if: matrix.name == 'linux-clang'
        run: sudo apt-get update && sudo apt-get install -yq ninja-build clang
      - name: Restore test data (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: test-data
          key: test-data-${{ hashFiles('.github/scripts/fetch-test-data.py') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Decompress test data (Windows)
        if: runner.os == 'Windows'
        run: python .github/scripts/fetch-test-data.py decompress
      - name: cmake (windows)
        if: runner.os == 'Windows'
        run: |
          $env:CXXFLAGS = "${{ matrix.cxx_flags }}"
          cmake --preset ${{ matrix.preset }} -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_path" -DNTFS_BROWSER_REQUIRE_TEST_DATA=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.build_type }}
      - name: cmake (linux)
        if: runner.os == 'Linux'
        run: |
          cmake --preset ${{ matrix.preset }} -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} || exit 1
          cmake --build --preset ${{ matrix.preset }} || exit 1
      - name: ctest
        run: ctest --output-on-failure --test-dir build/${{ matrix.preset }} -C ${{ matrix.build_type }} --parallel 16
  fetchcontent-consumer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: cmake
        run: |
          cmake -S fetchcontent-consumer -B build_fetchcontent_consumer -DNTFS_BROWSER_FETCHCONTENT_SOURCE_DIR="${{ github.workspace }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build_fetchcontent_consumer --target fetchcontent-smoke-test --config Debug --parallel 16
      - name: run
        run: .\build_fetchcontent_consumer\Debug\fetchcontent-smoke-test.exe
