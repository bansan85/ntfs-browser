---
name: Build
on: [push]
env:
  VERBOSE: 1
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build_type: [Debug, Release]
        name: [windows]
        build_shared_libs: [ON, OFF]
        include:
          - name: windows
            cxx: cl
            os: windows-latest
            cxx_flags: /MP
          - name: windows
            build_shared_libs: ON
            preset: shared
          - name: windows
            build_shared_libs: OFF
            preset: static
          - name: windows-no-decompression
            cxx: cl
            os: windows-latest
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            preset: no-decompression
            run_tests: true
          - name: windows-no-efs-cryptopp
            cxx: cl
            os: windows-latest
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            preset: efs-bcrypt-only
            run_tests: true
          - name: windows-no-efs-bcrypt
            cxx: cl
            os: windows-latest
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            preset: efs-cryptopp-only
            run_tests: true
          - name: windows-no-efs
            cxx: cl
            os: windows-latest
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            preset: no-efs
            run_tests: true
          - name: linux-gcc
            cxx: g++
            os: ubuntu-latest
            build_type: Debug
            preset: efs-cryptopp-only
          - name: linux-clang
            cxx: clang++
            os: ubuntu-latest
            build_type: Debug
            preset: efs-cryptopp-only
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install g++ (Linux)
        if: matrix.name == 'linux-gcc'
        run: sudo apt-get update && sudo apt-get install -yq ninja-build g++
      - name: Install clang (Linux)
        if: matrix.name == 'linux-clang'
        run: sudo apt-get update && sudo apt-get install -yq ninja-build clang
      - name: Enable MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: cmake (windows)
        if: runner.os == 'Windows'
        run: |
          $env:CXXFLAGS = "${{ matrix.cxx_flags }}"
          cmake --preset ${{ matrix.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_path" -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" || exit 1
          cmake --build --preset ${{ matrix.preset }} || exit 1
      - name: cmake (linux)
        if: runner.os == 'Linux'
        run: |
          cmake --preset ${{ matrix.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} || exit 1
          cmake --build --preset ${{ matrix.preset }} || exit 1
      - name: ctest
        if: matrix.run_tests
        run: ctest --output-on-failure --test-dir build/${{ matrix.preset }} || exit 1
  fetchcontent-consumer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: cmake
        run: |
          cmake -S fetchcontent-consumer -B build_fetchcontent_consumer -DNTFS_BROWSER_FETCHCONTENT_SOURCE_DIR="${{ github.workspace }}" || exit 1
          cmake --build build_fetchcontent_consumer --target fetchcontent-smoke-test --config Debug --parallel || exit 1
      - name: run
        run: .\build_fetchcontent_consumer\Debug\fetchcontent-smoke-test.exe
