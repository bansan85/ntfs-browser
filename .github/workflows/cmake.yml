---
name: Build
on: [push]
env:
  VERBOSE: 1
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build_type: [Debug, Release]
#        name: [gcc, clang, windows, clang-cfi]
        name: [windows]
        build_shared_libs: [ON, OFF]
        include:
#          - name: gcc
#            ar: /usr/bin/ar
#            cxx: /usr/bin/g++-11
#            ranlib: /usr/bin/ranlib
#            os: ubuntu-22.04
#            buildall: all
#            cxx_flags: -fno-omit-frame-pointer -g -O0
#            ld_flags: -Wl,-O0
#          - name: clang
#            ar: /usr/bin/llvm-ar-14
#            cxx: /usr/bin/clang++-14
#            ranlib: /usr/bin/llvm-ranlib-14
#            os: ubuntu-22.04
#            buildall: all
#            cxx_flags: -fno-omit-frame-pointer -g -O0
#            ld_flags: -Wl,-O0
          - name: windows
            cxx: cl
            os: windows-latest
            buildall: ALL_BUILD
            cxx_flags: /MP
          # Smoke-test each reduced configuration once (a single build_type /
          # build_shared_libs combination is enough to catch a bare, non-
          # _WIN32-paired use of the option leaking a link dependency): each
          # turns exactly one of the three feature options off.
          - name: windows-no-decompression
            cxx: cl
            os: windows-latest
            buildall: ALL_BUILD
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            extra_cmake_args: -DNTFS_BROWSER_ENABLE_DECOMPRESSION=OFF
          - name: windows-no-efs-cryptopp
            cxx: cl
            os: windows-latest
            buildall: ALL_BUILD
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            extra_cmake_args: -DNTFS_BROWSER_ENABLE_EFS_CRYPTOPP=OFF
          - name: windows-no-efs-bcrypt
            cxx: cl
            os: windows-latest
            buildall: ALL_BUILD
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            extra_cmake_args: -DNTFS_BROWSER_ENABLE_EFS_BCRYPT=OFF
          # Both EFS backends off: the only leg that actually exercises the
          # "neither backend compiled" fallback paths (file-record.cpp,
          # attr-non-resident.cpp, efs-context.cpp) and efs-disabled-tests.cpp.
          - name: windows-no-efs
            cxx: cl
            os: windows-latest
            buildall: ALL_BUILD
            cxx_flags: /MP
            build_type: Debug
            build_shared_libs: OFF
            extra_cmake_args: -DNTFS_BROWSER_ENABLE_EFS_CRYPTOPP=OFF -DNTFS_BROWSER_ENABLE_EFS_BCRYPT=OFF
#          - name: clang-cfi
#            ar: /usr/bin/llvm-ar-14
#            cxx: /usr/bin/clang++-14
#            ranlib: /usr/bin/llvm-ranlib-14
#            os: ubuntu-22.04
#            buildall: all
#            cxx_flags: -fno-omit-frame-pointer -g -O0 -fsanitize=cfi -flto=thin -fvisibility=hidden -fno-sanitize-trap=cfi
#            ld_flags: -fuse-ld=gold -Wl,-O0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
#      - name: Install gcc
#        if: contains(matrix.cxx, '/g++')
#        run: sudo apt-get install -yq g++-11 gcc-11
#      - name: Install clang
#        if: contains(matrix.cxx, 'clang++')
#       run: sudo apt-get install -yq clang-14 llvm-14
#      - name: Install NSIS (Linux)
#        if: contains(matrix.os, 'ubuntu')
#        run: sudo apt-get install -yq nsis
#      - name: Install NSIS (Windows)
#        if: contains(matrix.os, 'windows')
#        run: |
#          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
#          scoop bucket add extras
#          scoop install nsis
      - name: cmake
        run: |
          mkdir build_lib
          $env:CXXFLAGS = "${{ matrix.cxx_flags }}"
          cmake -S . -B build_lib -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_path" -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" -DBUILD_SHARED_LIBS:BOOL=${{ matrix.build_shared_libs }} -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.ld_flags }}" ${{ matrix.extra_cmake_args }} || exit 1
          cmake --build build_lib/ --target ${{ matrix.buildall }} --config ${{ matrix.build_type }} || exit 1
      # Only the reduced-configuration legs run ctest here: they are what this
      # matrix exists to catch regressions in. The plain "windows" leg does
      # not run ctest at all, in this workflow or any other.
      - name: ctest
        if: matrix.extra_cmake_args != ''
        run: ctest --output-on-failure --test-dir build_lib -C ${{ matrix.build_type }} || exit 1
  # Builds fetchcontent-consumer/ as its own, separate CMake project, the way
  # an external project depending on NtfsBrowser through FetchContent would,
  # with every NTFS_BROWSER_* option and BUILD_SHARED_LIBS on.
  fetchcontent-consumer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: cmake
        run: |
          cmake -S fetchcontent-consumer -B build_fetchcontent_consumer -DNTFS_BROWSER_FETCHCONTENT_SOURCE_DIR="${{ github.workspace }}" || exit 1
          cmake --build build_fetchcontent_consumer --target fetchcontent-smoke-test --config Debug --parallel || exit 1
      - name: run
        run: .\build_fetchcontent_consumer\Debug\fetchcontent-smoke-test.exe
